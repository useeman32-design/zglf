<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZGLF Admin</title>
<link rel="icon" type="image/png" href="../images/favicon.png">
<link rel="stylesheet" href="admin.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
</head>
<body>

<div id="loginScreen">
  <div class="login-card">
    <div class="logo"><img src="../images/zglf-logo.png" alt="ZGLF" onerror="this.style.display='none'"></div>
    <h1>ZGLF Admin</h1>
    <p class="sub">Sign in to manage the Zee Glow Link Foundation website.</p>
    <form id="loginForm" onsubmit="doLogin(event)">
      <div class="field"><label>Username or Email</label><input id="loginUser" placeholder="admin" required autofocus></div>
      <div class="field"><label>Password</label><input id="loginPass" type="password" placeholder="••••••••" required></div>
      <button class="btn-primary" type="submit" style="width:100%;justify-content:center;margin-top:8px"><i class="fas fa-sign-in-alt"></i> Sign In</button>
      <div id="loginErr"></div>
    </form>
    <p class="muted small text-center" style="margin-top:16px">Default: <b>admin</b> / <b>admin123</b></p>
  </div>
</div>

<div id="shell" style="display:none">
  <aside id="sideBar">
    <div id="brandLogo"></div>
    <nav id="sideNav"></nav>
  </aside>
  <main id="main">
    <div id="pageMain"></div>
  </main>
</div>

<div id="overlay"><div id="overlayContent"></div></div>
<div id="toasts"></div>

<script src="admin.js"></script>
</body>
</html>
