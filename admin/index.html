<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZGLF Admin — Content Management</title>
<link rel="icon" type="image/jpeg" href="../images/zglf-logo.jpg">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --azure-950:#070f28;--azure-900:#0c1a42;--azure-800:#122660;--azure-700:#1a37b8;
  --azure-500:#2b4ed4;--azure-100:#dbe4ff;--azure-50:#f0f4ff;
  --gold-400:#f5c842;--gold-500:#e6b01a;--gold-600:#c9900d;--gold-50:#fef9e8;
  --cream:#faf7f0;--white:#fff;
  --gray-50:#f8fafc;--gray-100:#f1f5f9;--gray-200:#e2e8f0;--gray-300:#cbd5e1;
  --gray-400:#94a3b8;--gray-500:#64748b;--gray-600:#475569;--gray-700:#334155;
  --gray-800:#1e293b;--gray-900:#0f172a;
  --emerald:#10b981;--emerald-bg:#ecfdf5;--rose:#ef4444;--rose-bg:#fef2f2;
  --amber:#f59e0b;--violet:#8b5cf6;
  --sidebar-w:270px;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;font-family:'Inter',system-ui,-apple-system,sans-serif;background:#f6f8fc;color:var(--gray-800);-webkit-font-smoothing:antialiased;font-size:14px;}
button{font-family:inherit;cursor:pointer;border:none;background:none;}
input,select,textarea{font-family:inherit;}
a{color:inherit;text-decoration:none;}
.font-serif{font-family:'Playfair Display',Georgia,serif;}

/* Scrollbar */
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:4px;}
::-webkit-scrollbar-thumb:hover{background:#94a3b8;}

/* ============ LOGIN ============ */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#04081a 0%,#070f28 30%,#0c1a42 70%,#122660 100%);padding:20px;position:relative;overflow:hidden;}
.login-wrap::before{content:'';position:absolute;width:600px;height:600px;background:radial-gradient(circle,rgba(245,200,66,0.18),transparent 60%);top:-200px;right:-200px;border-radius:50%;animation:float 8s ease-in-out infinite;}
.login-wrap::after{content:'';position:absolute;width:500px;height:500px;background:radial-gradient(circle,rgba(26,55,184,0.3),transparent 60%);bottom:-150px;left:-150px;border-radius:50%;}
@keyframes float{0%,100%{transform:translate(0,0)}50%{transform:translate(-20px,20px)}}
.login-card{background:rgba(255,255,255,0.98);backdrop-filter:blur(20px);border-radius:24px;padding:48px 44px;width:100%;max-width:440px;box-shadow:0 40px 100px rgba(0,0,0,0.4);position:relative;z-index:1;border:1px solid rgba(255,255,255,0.8);}
.login-logo{display:flex;align-items:center;gap:14px;margin-bottom:32px;justify-content:center;}
.login-logo img{width:64px;height:64px;border-radius:14px;border:2px solid var(--gold-400);box-shadow:0 8px 24px rgba(245,200,66,0.3);}
.login-logo-text h1{font-family:'Playfair Display',serif;font-size:22px;font-weight:800;color:var(--azure-900);letter-spacing:-0.02em;}
.login-logo-text p{font-size:10px;color:var(--gold-600);text-transform:uppercase;letter-spacing:0.25em;font-weight:700;margin-top:3px;}
.login-title{text-align:center;margin-bottom:28px;}
.login-title h2{font-size:24px;font-weight:700;color:var(--gray-900);}
.login-title p{font-size:13px;color:var(--gray-500);margin-top:6px;}
.form-group{margin-bottom:18px;}
.form-group label{display:block;font-size:11px;font-weight:700;color:var(--gray-700);margin-bottom:7px;text-transform:uppercase;letter-spacing:0.06em;}
.form-input{width:100%;padding:12px 14px;border-radius:10px;border:1.5px solid var(--gray-200);font-size:14px;color:var(--gray-800);transition:all .2s;background:var(--white);}
.form-input:hover{border-color:var(--gray-300);}
.form-input:focus{outline:none;border-color:var(--azure-700);box-shadow:0 0 0 4px rgba(26,55,184,0.1);}
.form-input::placeholder{color:var(--gray-400);}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 20px;border-radius:10px;font-size:14px;font-weight:600;transition:all .2s;white-space:nowrap;}
.btn-primary{background:linear-gradient(135deg,var(--azure-700),var(--azure-500));color:var(--white);width:100%;box-shadow:0 4px 14px rgba(26,55,184,0.3);}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 8px 24px rgba(26,55,184,0.4);}
.btn-gold{background:linear-gradient(135deg,var(--gold-500),var(--gold-400));color:var(--azure-900);}
.btn-gold:hover{box-shadow:0 8px 24px rgba(245,200,66,0.4);transform:translateY(-1px);}
.btn-danger{background:var(--rose);color:var(--white);}
.btn-danger:hover{background:#dc2626;transform:translateY(-1px);}
.btn-outline{border:1.5px solid var(--gray-200);color:var(--gray-700);background:var(--white);}
.btn-outline:hover{border-color:var(--azure-700);color:var(--azure-700);background:var(--azure-50);}
.btn-ghost{color:var(--gray-600);padding:8px 12px;border-radius:8px;font-size:13px;}
.btn-ghost:hover{background:var(--gray-100);color:var(--gray-800);}
.btn-sm{padding:8px 14px;font-size:12px;border-radius:8px;}
.error-msg{background:#fef2f2;color:#b91c1c;padding:12px 14px;border-radius:10px;font-size:13px;margin-bottom:16px;border-left:3px solid var(--rose);display:flex;align-items:center;gap:8px;}
.error-msg i{font-size:14px;}
.login-hint{margin-top:20px;text-align:center;font-size:11px;color:var(--gray-400);padding-top:20px;border-top:1px solid var(--gray-100);}
.login-hint strong{color:var(--gray-600);font-family:monospace;background:var(--gray-50);padding:2px 8px;border-radius:4px;font-size:10px;}

/* ============ APP LAYOUT ============ */
.app{display:flex;min-height:100vh;}
.sidebar{width:var(--sidebar-w);background:#ffffff;border-right:1px solid var(--gray-100);position:fixed;top:0;left:0;bottom:0;display:flex;flex-direction:column;transition:transform .3s;z-index:50;}
.sidebar-header{padding:22px 20px;border-bottom:1px solid var(--gray-100);}
.sidebar-brand{display:flex;align-items:center;gap:12px;}
.sidebar-brand img{width:42px;height:42px;border-radius:10px;border:2px solid var(--gold-400);}
.sidebar-brand-text h3{font-size:14px;font-weight:800;letter-spacing:-0.01em;color:var(--gray-900);font-family:'Playfair Display',serif;}
.sidebar-brand-text p{font-size:9px;color:var(--gold-600);text-transform:uppercase;letter-spacing:0.2em;font-weight:700;margin-top:2px;}
.sidebar-nav{flex:1;padding:14px 12px;overflow-y:auto;}
.nav-section{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.15em;color:var(--gray-400);padding:14px 12px 8px;}
.nav-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:var(--gray-600);font-size:13px;font-weight:500;cursor:pointer;transition:all .2s;margin-bottom:2px;position:relative;}
.nav-item:hover{background:var(--gray-50);color:var(--gray-900);}
.nav-item.active{background:linear-gradient(135deg,var(--azure-700),var(--azure-500));color:var(--white);box-shadow:0 4px 14px rgba(26,55,184,0.25);}
.nav-item.active i{color:var(--white);}
.nav-item i{width:18px;font-size:14px;text-align:center;color:var(--gray-400);}
.nav-badge{margin-left:auto;background:var(--rose);color:white;font-size:9px;font-weight:700;padding:2px 7px;border-radius:10px;min-width:18px;text-align:center;}
.nav-item.active .nav-badge{background:rgba(255,255,255,0.25);}
.sidebar-footer{padding:14px;border-top:1px solid var(--gray-100);}
.sidebar-user{display:flex;align-items:center;gap:10px;}
.sidebar-user-avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--gold-400),var(--gold-500));color:var(--azure-900);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;}
.sidebar-user-info{flex:1;min-width:0;}
.sidebar-user-name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--gray-800);}
.sidebar-user-role{font-size:10px;color:var(--gold-600);text-transform:uppercase;letter-spacing:0.1em;margin-top:2px;}
.sidebar-logout{color:var(--gray-400);padding:8px;border-radius:8px;transition:all .2s;}
.sidebar-logout:hover{color:var(--rose);background:var(--rose-bg);}

.main{flex:1;margin-left:var(--sidebar-w);min-width:0;background:#f6f8fc;min-height:100vh;}
.topbar{background:var(--white);border-bottom:1px solid var(--gray-100);padding:16px 32px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:40;}
.topbar-left{display:flex;align-items:center;gap:16px;}
.hamburger{display:none;font-size:18px;color:var(--gray-700);padding:10px;border-radius:10px;}
.hamburger:hover{background:var(--gray-50);}
.page-title h1{font-size:18px;font-weight:700;color:var(--gray-900);}
.page-title p{font-size:12px;color:var(--gray-500);margin-top:2px;}
.topbar-right{display:flex;align-items:center;gap:10px;}
.topbar-icon{position:relative;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--gray-600);background:var(--gray-50);cursor:pointer;transition:all .2s;}
.topbar-icon:hover{background:var(--azure-50);color:var(--azure-700);}
.topbar-icon .badge{position:absolute;top:-4px;right:-4px;background:var(--rose);color:var(--white);font-size:9px;font-weight:700;width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:2px solid var(--white);}
.view-site{display:inline-flex;align-items:center;gap:6px;padding:9px 14px;border-radius:10px;background:var(--azure-50);color:var(--azure-700);font-size:12px;font-weight:600;transition:all .2s;border:1px solid transparent;}
.view-site:hover{background:var(--azure-700);color:var(--white);}
.content{padding:28px 32px;max-width:1500px;}

/* Stats */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-bottom:24px;}
.stat-card{background:var(--white);border-radius:16px;padding:22px;border:1px solid var(--gray-100);transition:all .25s;position:relative;overflow:hidden;}
.stat-card::before{content:'';position:absolute;top:0;left:0;width:4px;height:100%;background:var(--azure-700);}
.stat-card:hover{transform:translateY(-3px);box-shadow:0 12px 24px rgba(15,23,42,0.08);}
.stat-card.gold::before{background:var(--gold-500);}
.stat-card.green::before{background:var(--emerald);}
.stat-card.red::before{background:var(--rose);}
.stat-card.purple::before{background:var(--violet);}
.stat-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.stat-icon{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:18px;}
.stat-icon.blue{background:rgba(26,55,184,0.1);color:var(--azure-700);}
.stat-icon.gold{background:rgba(245,200,66,0.2);color:var(--gold-600);}
.stat-icon.green{background:rgba(16,185,129,0.12);color:var(--emerald);}
.stat-icon.red{background:rgba(239,68,68,0.1);color:var(--rose);}
.stat-icon.purple{background:rgba(139,92,246,0.1);color:var(--violet);}
.stat-label{font-size:11px;color:var(--gray-500);font-weight:600;text-transform:uppercase;letter-spacing:0.06em;}
.stat-value{font-size:28px;font-weight:800;color:var(--gray-900);margin:4px 0 6px;letter-spacing:-0.02em;}
.stat-change{font-size:11px;display:inline-flex;align-items:center;gap:4px;font-weight:500;}
.stat-change.up{color:var(--emerald);}
.stat-change.down{color:var(--rose);}

/* Cards */
.card{background:var(--white);border-radius:16px;border:1px solid var(--gray-100);margin-bottom:20px;overflow:hidden;}
.card-header{padding:20px 24px;border-bottom:1px solid var(--gray-100);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:var(--white);}
.card-header h3{font-size:15px;font-weight:700;color:var(--gray-900);display:flex;align-items:center;gap:10px;}
.card-header h3 i{width:28px;height:28px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;font-size:13px;background:var(--azure-50);color:var(--azure-700);}
.card-body{padding:24px;}
.card-body.p-sm{padding:16px;}
.card-section-title{font-size:11px;font-weight:700;color:var(--gray-400);text-transform:uppercase;letter-spacing:0.1em;margin:20px 0 12px;padding-bottom:8px;border-bottom:1px solid var(--gray-100);}
.card-section-title:first-child{margin-top:0;}

/* Charts */
.charts-grid{display:grid;grid-template-columns:2fr 1fr;gap:20px;margin-bottom:24px;}
.chart-box{position:relative;height:300px;}
@media(max-width:1024px){.charts-grid{grid-template-columns:1fr;}}

/* Tables */
.table-wrap{overflow-x:auto;border-radius:12px;border:1px solid var(--gray-100);}
table{width:100%;border-collapse:collapse;}
th{text-align:left;font-size:10px;font-weight:700;color:var(--gray-500);text-transform:uppercase;letter-spacing:0.08em;padding:14px 18px;border-bottom:1px solid var(--gray-100);background:var(--gray-50);}
td{padding:14px 18px;font-size:13px;color:var(--gray-700);border-bottom:1px solid var(--gray-50);vertical-align:middle;}
tr:last-child td{border-bottom:none;}
tr:hover td{background:#fafbff;}

/* Tags */
.tag{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:600;line-height:1.5;}
.tag.blue{background:rgba(26,55,184,0.1);color:var(--azure-700);}
.tag.green{background:var(--emerald-bg);color:var(--emerald);}
.tag.gold{background:var(--gold-50);color:var(--gold-600);}
.tag.red{background:var(--rose-bg);color:var(--rose);}
.tag.gray{background:var(--gray-100);color:var(--gray-600);}
.tag.purple{background:rgba(139,92,246,0.1);color:var(--violet);}

.row-actions{display:flex;gap:4px;}
.icon-btn{width:32px;height:32px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;color:var(--gray-500);transition:all .15s;font-size:13px;}
.icon-btn:hover{background:var(--gray-100);color:var(--gray-700);}
.icon-btn.edit:hover{color:var(--azure-700);background:rgba(26,55,184,0.08);}
.icon-btn.delete:hover{color:var(--rose);background:var(--rose-bg);}

/* Tabs */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--gray-200);padding:0 24px;background:var(--white);overflow-x:auto;}
.tab{padding:14px 18px;font-size:13px;font-weight:600;color:var(--gray-500);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .2s;white-space:nowrap;}
.tab:hover{color:var(--azure-700);}
.tab.active{color:var(--azure-700);border-bottom-color:var(--azure-700);}

/* Forms */
.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;}
.form-grid .full{grid-column:1/-1;}
@media(max-width:640px){.form-grid{grid-template-columns:1fr;}}
.form-label{display:block;font-size:12px;font-weight:600;color:var(--gray-700);margin-bottom:7px;}
.form-label .req{color:var(--rose);margin-left:2px;}
.form-help{font-size:11px;color:var(--gray-400);margin-top:5px;}
textarea.form-input{resize:vertical;min-height:100px;line-height:1.5;}
.form-check{display:flex;align-items:center;gap:10px;padding:8px 0;cursor:pointer;}
.form-check input[type=checkbox]{width:17px;height:17px;accent-color:var(--azure-700);cursor:pointer;}
.form-check label{font-size:13px;color:var(--gray-700);font-weight:500;cursor:pointer;}
.perm-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;padding:14px 0;border-top:1px solid var(--gray-100);margin-top:12px;}
.perm-block{padding:12px;border:1px solid var(--gray-200);border-radius:10px;background:var(--gray-50);}
.perm-block h5{font-size:10px;text-transform:uppercase;color:var(--gray-500);font-weight:700;letter-spacing:0.08em;margin-bottom:10px;}

/* Media uploader */
.upload-zone{border:2px dashed var(--gray-300);border-radius:12px;padding:28px;text-align:center;cursor:pointer;transition:all .2s;background:var(--gray-50);margin-bottom:10px;}
.upload-zone:hover{border-color:var(--azure-700);background:var(--azure-50);}
.upload-zone i{font-size:32px;color:var(--gray-400);margin-bottom:10px;}
.upload-zone p{font-size:13px;color:var(--gray-600);font-weight:500;}
.upload-zone small{font-size:11px;color:var(--gray-400);}
.media-preview{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px;}
.media-thumb{position:relative;width:140px;border-radius:10px;overflow:hidden;border:2px solid var(--gray-200);background:var(--gray-900);}
.media-thumb img,.media-thumb video{width:100%;height:100px;object-fit:cover;display:block;}
.media-thumb .remove-btn{position:absolute;top:6px;right:6px;width:24px;height:24px;background:rgba(0,0,0,0.7);color:white;border-radius:6px;font-size:11px;display:flex;align-items:center;justify-content:center;}
.media-thumb .media-type{position:absolute;top:6px;left:6px;background:rgba(0,0,0,0.7);color:white;font-size:9px;padding:2px 6px;border-radius:4px;font-weight:600;text-transform:uppercase;}
.url-input-row{display:flex;gap:8px;align-items:center;margin-top:8px;}
.url-input-row .form-input{flex:1;}
.url-input-row span{font-size:12px;color:var(--gray-400);}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(7,15,40,0.6);backdrop-filter:blur(4px);z-index:100;display:none;align-items:flex-start;justify-content:center;padding:40px 20px;overflow-y:auto;}
.modal-overlay.open{display:flex;}
.modal{background:var(--white);border-radius:20px;width:100%;max-width:720px;max-height:calc(100vh - 80px);overflow-y:auto;box-shadow:0 30px 80px rgba(0,0,0,0.3);animation:slideUp .3s ease;}
.modal.xl{max-width:960px;}
@keyframes slideUp{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}
.modal-header{padding:22px 24px;border-bottom:1px solid var(--gray-100);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--white);z-index:1;}
.modal-header h3{font-size:17px;font-weight:700;color:var(--gray-900);}
.modal-close{width:34px;height:34px;border-radius:10px;color:var(--gray-500);font-size:18px;display:flex;align-items:center;justify-content:center;}
.modal-close:hover{background:var(--gray-100);color:var(--gray-800);}
.modal-body{padding:24px;}
.modal-footer{padding:16px 24px;border-top:1px solid var(--gray-100);display:flex;justify-content:flex-end;gap:10px;position:sticky;bottom:0;background:var(--white);}

/* Photo grid */
.photo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px;}
.photo-card{border-radius:14px;overflow:hidden;border:1px solid var(--gray-100);background:var(--white);position:relative;transition:all .2s;}
.photo-card:hover{box-shadow:0 8px 20px rgba(0,0,0,0.1);transform:translateY(-2px);}
.photo-card .thumb{width:100%;height:150px;position:relative;overflow:hidden;background:var(--gray-100);}
.photo-card .thumb img,.photo-card .thumb video{width:100%;height:100%;object-fit:cover;display:block;}
.photo-card .thumb .media-badge{position:absolute;top:8px;left:8px;background:rgba(0,0,0,0.7);color:var(--white);font-size:9px;font-weight:700;padding:3px 8px;border-radius:6px;text-transform:uppercase;letter-spacing:0.05em;}
.photo-card-actions{position:absolute;top:8px;right:8px;display:flex;gap:4px;opacity:0;transition:opacity .2s;}
.photo-card:hover .photo-card-actions{opacity:1;}
.photo-card-actions button{background:rgba(0,0,0,0.75);color:var(--white);width:30px;height:30px;border-radius:8px;font-size:12px;}
.photo-card-actions button:hover{background:var(--rose);}
.photo-card-meta{padding:12px;}
.photo-card-meta h5{font-size:13px;font-weight:600;color:var(--gray-800);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.photo-card-meta p{font-size:11px;color:var(--gray-500);margin-top:3px;}
.photo-card .featured-star{position:absolute;bottom:8px;left:8px;background:var(--gold-400);color:var(--azure-900);width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;box-shadow:0 2px 8px rgba(0,0,0,0.2);}

/* Hero slides preview */
.hero-slide-preview{border:2px solid var(--gray-200);border-radius:14px;overflow:hidden;margin-bottom:14px;position:relative;transition:all .2s;}
.hero-slide-preview.active{border-color:var(--azure-700);box-shadow:0 0 0 3px rgba(26,55,184,0.1);}
.hero-slide-preview .thumb{height:180px;background-size:cover;background-position:center;position:relative;}
.hero-slide-preview .thumb::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(7,15,40,0.1) 0%,rgba(7,15,40,0.7) 100%);}
.hero-slide-preview .thumb-info{position:absolute;bottom:12px;left:14px;right:14px;color:white;z-index:1;}
.hero-slide-preview .thumb-info h5{font-size:14px;font-weight:700;text-shadow:0 2px 8px rgba(0,0,0,0.5);}
.hero-slide-preview .thumb-info small{font-size:11px;opacity:0.85;}
.hero-slide-actions{padding:10px 12px;display:flex;gap:6px;justify-content:space-between;align-items:center;background:var(--white);}
.hero-slide-actions .left{display:flex;gap:4px;}

/* Quick actions */
.quick-actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:24px;}
.quick-action{background:var(--white);border:1px solid var(--gray-100);border-radius:14px;padding:18px;cursor:pointer;transition:all .2s;text-align:left;display:flex;flex-direction:column;gap:10px;}
.quick-action:hover{border-color:var(--azure-700);transform:translateY(-2px);box-shadow:0 8px 20px rgba(0,0,0,0.06);}
.quick-action i{font-size:20px;color:var(--azure-700);width:42px;height:42px;border-radius:10px;background:rgba(26,55,184,0.1);display:flex;align-items:center;justify-content:center;}
.quick-action h4{font-size:13px;font-weight:700;color:var(--gray-900);}
.quick-action p{font-size:11px;color:var(--gray-500);line-height:1.4;}

/* Event cards */
.event-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:18px;}
.event-card{background:var(--white);border:1px solid var(--gray-100);border-radius:16px;overflow:hidden;transition:all .2s;}
.event-card:hover{box-shadow:0 12px 28px rgba(0,0,0,0.1);transform:translateY(-2px);}
.event-card-media{height:180px;position:relative;overflow:hidden;background:var(--gray-100);}
.event-card-media img,.event-card-media video{width:100%;height:100%;object-fit:cover;display:block;}
.event-card-date{position:absolute;top:12px;left:12px;background:var(--white);border-radius:12px;padding:8px 12px;text-align:center;min-width:54px;box-shadow:0 4px 14px rgba(0,0,0,0.15);}
.event-card-date .day{font-size:20px;font-weight:800;color:var(--azure-900);line-height:1;}
.event-card-date .month{font-size:9px;font-weight:700;color:var(--gold-600);text-transform:uppercase;letter-spacing:0.08em;}
.event-card-date.has-video::after{content:'\f04b';font-family:'Font Awesome 6 Free';font-weight:900;color:rgba(255,255,255,0.9);position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:44px;height:44px;background:rgba(7,15,40,0.6);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;}
.event-card-body{padding:18px;}
.event-card-body h4{font-size:15px;font-weight:700;color:var(--gray-900);margin-bottom:6px;line-height:1.35;}
.event-card-body p{font-size:12px;color:var(--gray-500);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.event-card-meta{display:flex;gap:14px;margin-top:12px;font-size:11px;color:var(--gray-500);}
.event-card-meta span{display:flex;align-items:center;gap:5px;}
.event-card-actions{padding:12px 18px;border-top:1px solid var(--gray-100);display:flex;gap:8px;justify-content:flex-between;background:var(--gray-50);}
.event-card-actions{justify-content:flex-end;}
.event-card.has-video .event-card-date{background:var(--rose);color:white;}
.event-card.has-video .event-card-date .day,.event-card.has-video .event-card-date .month{color:white;}
.event-card .video-play{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:56px;height:56px;background:rgba(255,255,255,0.9);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--azure-900);box-shadow:0 4px 20px rgba(0,0,0,0.3);}

/* Donations */
.donation-amount{font-weight:800;color:var(--emerald);font-size:15px;letter-spacing:-0.01em;}
.donor-avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--azure-500),var(--azure-700));color:var(--white);display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;flex-shrink:0;}
.donor-cell{display:flex;align-items:center;gap:12px;}

/* Activity */
.activity-item{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--gray-50);}
.activity-item:last-child{border-bottom:none;}
.activity-icon{width:38px;height:38px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:13px;}
.activity-body{flex:1;min-width:0;}
.activity-body p{font-size:13px;color:var(--gray-700);line-height:1.5;}
.activity-body p strong{color:var(--gray-900);}
.activity-time{font-size:11px;color:var(--gray-400);margin-top:4px;}

/* Toast */
.toast{position:fixed;bottom:28px;right:28px;background:var(--gray-900);color:var(--white);padding:14px 20px;border-radius:12px;font-size:13px;font-weight:500;box-shadow:0 12px 40px rgba(0,0,0,0.25);z-index:200;transform:translateY(120px);opacity:0;transition:all .3s cubic-bezier(.2,.9,.3,1.2);display:flex;align-items:center;gap:10px;max-width:calc(100vw - 56px);}
.toast.show{transform:translateY(0);opacity:1;}
.toast.success{background:var(--emerald);}
.toast.error{background:var(--rose);}

/* Empty states */
.empty-state{padding:60px 20px;text-align:center;color:var(--gray-400);}
.empty-state i{font-size:48px;margin-bottom:16px;opacity:0.3;}
.empty-state p{font-size:14px;}

.mobile-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:45;}
.mobile-overlay.open{display:block;}

/* Hero editor live preview */
.hero-live-preview{border-radius:14px;overflow:hidden;border:1px solid var(--gray-200);aspect-ratio:16/7;background:#070f28;position:relative;}

.hero-live-preview .slide-text p{font-size:11px;opacity:0.8;margin-top:4px;}

/* Program cover preview */
.cover-preview{border-radius:12px;overflow:hidden;height:160px;background-size:cover;background-position:center;border:1px solid var(--gray-200);position:relative;margin-bottom:10px;}
.cover-preview .ph{display:flex;align-items:center;justify-content:center;height:100%;background:var(--gray-100);color:var(--gray-400);font-size:32px;}

@media(max-width:1023px){

}

function loadData(){let d=localStorage.getItem(LS_KEY);if(!d){saveData(DEFAULT_DATA);return JSON.parse(JSON.stringify(DEFAULT_DATA));}try{return JSON.parse(d);}catch(e){saveData(DEFAULT_DATA);return JSON.parse(JSON.stringify(DEFAULT_DATA));}}
function saveData(d){localStorage.setItem(LS_KEY,JSON.stringify(d));}
let DATA=loadData();
function uid(){return Date.now()+Math.floor(Math.random()*1000);}

/* ============================ AUTH ============================ */
let CURRENT_USER=null;
function getSession(){const s=sessionStorage.getItem(SESSION_KEY);return s?JSON.parse(s):null;}
function setSession(u){sessionStorage.setItem(SESSION_KEY,JSON.stringify(u));}
function clearSession(){sessionStorage.removeItem(SESSION_KEY);}
function login(username,password){const u=DATA.users.find(x=>(x.email===username||x.username===username)&&x.passwordHash===simpleHash(password)&&x.status==='active');if(!u)return false;CURRENT_USER={id:u.id,name:u.name,email:u.email,username:u.username,role:u.role,perms:u.perms};setSession(CURRENT_USER);return true;}
function logout(){clearSession();CURRENT_USER=null;location.hash='#/login';render();}
function can(p){if(!CURRENT_USER)return false;if(CURRENT_USER.role==='admin')return true;return !!CURRENT_USER.perms[p];}

/* ============================ MENU ============================ */
const MENU=[
  {section:"Overview",items:[{key:"dashboard",label:"Dashboard",icon:"fa-gauge-high",perm:"dashboard"}]},

    {key:"events",label:"Events",icon:"fa-calendar-days",perm:"events"},

  ]},

    {key:"reports",label:"Reports",icon:"fa-chart-line",perm:"reports"},
    {key:"settings",label:"Settings",icon:"fa-cog",perm:"settings"},
  ]}

function buildSidebar(){
  const nav=document.getElementById('sidebarNav');
  nav.innerHTML=MENU.map(sec=>{
    const visible=sec.items.filter(it=>it.perm==="dashboard"||can(it.perm));
    if(!visible.length)return '';
    return `<div class="nav-section">${sec.section}</div>`+visible.map(it=>{
      const badge=(it.key==='messages')?DATA.messages.filter(m=>!m.read).length:0;
      return `<div class="nav-item" data-route="${it.key}" onclick="navigate('${it.key}')"><i class="fa-solid ${it.icon}"></i>${it.label}${badge?`<span class="nav-badge">${badge}</span>`:''}</div>`;
    }).join('');
  }).join('');
}

/* ============================ ROUTER ============================ */
let currentPage='dashboard';
function navigate(key){location.hash='#/'+key;}
function setActiveNav(key){document.querySelectorAll('.nav-item').forEach(n=>n.classList.toggle('active',n.dataset.route===key));}

const PAGES={dashboard:renderDashboard,hero:renderHero,programs:renderPrograms,events:renderEvents,photos:renderPhotos,site:renderSite,donations:renderDonations,members:renderMembers,messages:renderMessages,users:renderUsers,reports:renderReports,settings:renderSettings};

function render(){
  const sess=getSession();
  const hash=location.hash.replace('#/','')||(sess?'dashboard':'login');
  if(hash==='login'||!sess){document.getElementById('loginView').style.display='flex';document.getElementById('appView').style.display='none';return;}
  CURRENT_USER=sess;
  document.getElementById('loginView').style.display='none';document.getElementById('appView').style.display='block';

/* Helper: media uploader UI for a single media item (image/video) */
function mediaUploader(initial,inputId,acceptHint){
  const m=initial||null;
  const hasVideo=m&&m.type==='video';
  const thumb=m?(m.type==='video'
    ?`<video src="${m.url}" style="width:100%;height:120px;object-fit:cover"></video>`
    :`<img src="${m.url}" style="width:100%;height:120px;object-fit:cover">`):'';
  return `
    <div id="${inputId}-wrap">
      <div class="upload-zone" onclick="document.getElementById('${inputId}-file').click()" id="${inputId}-zone">
        <i class="fa-solid fa-cloud-arrow-up"></i>
        <p><strong>Click to upload</strong> or drag & drop</p>
        <small>${acceptHint||'Images (JPG, PNG, WebP) or Videos (MP4, WebM)'}</small>
        <input type="file" id="${inputId}-file" accept="image/*,video/*" style="display:none" onchange="handleMediaUpload(event,'${inputId}')">
      </div>
      <div class="url-input-row">
        <span>or paste URL:</span>
        <input class="form-input" id="${inputId}-url" placeholder="https://.../image.jpg or video.mp4" value="${m?escapeHtml(m.url):''}">
        <button type="button" class="btn btn-sm btn-outline" onclick="applyMediaUrl('${inputId}')">Use</button>
      </div>
      <div class="media-preview" id="${inputId}-preview" style="${m?'':'display:none'}">
        <div class="media-thumb" id="${inputId}-thumb">
          ${thumb}
          <span class="media-type" id="${inputId}-type">${m?(m.type==='video'?'Video':'Image'):''}</span>
          <button type="button" class="remove-btn" onclick="clearMedia('${inputId}')"><i class="fa-solid fa-xmark"></i></button>
        </div>
      </div>
      <input type="hidden" id="${inputId}-data" value="${m?escapeHtml(JSON.stringify(m)):''}">
    </div>
  `;
}
function handleMediaUpload(e,id){
  const f=e.target.files[0];if(!f)return;
  const isVideo=f.type.startsWith('video/');
  // warn if video > 25MB for localStorage
  if(isVideo&&f.size>20*1024*1024){toast('Video exceeds 20MB. Please use a URL instead for large videos.','error');return;}
  const r=new FileReader();r.onload=ev=>{
    const data={type:isVideo?'video':'image',url:ev.target.result,name:f.name};
    document.getElementById(id+'-data').value=JSON.stringify(data);
    showMediaThumb(id,data);
  };r.readAsDataURL(f);
}
function applyMediaUrl(id){
  const url=document.getElementById(id+'-url').value.trim();if(!url)return;
  const isVideo=/\.(mp4|webm|mov|ogg)($|\?)/i.test(url);
  const data={type:isVideo?'video':'image',url:url};
  document.getElementById(id+'-data').value=JSON.stringify(data);
  showMediaThumb(id,data);
}
function showMediaThumb(id,data){
  const wrap=document.getElementById(id+'-preview');
  const thumb=document.getElementById(id+'-thumb');
  wrap.style.display='flex';
  thumb.innerHTML=(data.type==='video'
    ?`<video src="${data.url}" muted style="width:100%;height:100px;object-fit:cover"></video>`
    :`<img src="${data.url}" style="width:100%;height:100px;object-fit:cover" onerror="this.style.opacity=0.3;this.alt='Preview unavailable'">`)
    +`<span class="media-type">${data.type==='video'?'Video':'Image'}</span>`
    +`<button type="button" class="remove-btn" onclick="clearMedia('${id}')"><i class="fa-solid fa-xmark"></i></button>`;
}
function clearMedia(id){
  document.getElementById(id+'-data').value='';
  document.getElementById(id+'-url').value='';
  document.getElementById(id+'-preview').style.display='none';
  document.getElementById(id+'-file').value='';
}
function getMediaData(id){
  const v=document.getElementById(id+'-data').value;
  if(!v)return null;
  try{return JSON.parse(v);}catch(e){return null;}
}

/* Multi-media uploader (for events - multiple photos/videos) */
function multiMediaInit(existing,containerId,hiddenId){
  let items=existing?[...existing]:[];
  const input=document.getElementById(hiddenId);
  function render(){
    input.value=JSON.stringify(items);
    document.getElementById(containerId).innerHTML=items.map((m,i)=>`
      <div class="media-thumb">
        ${m.type==='video'
          ?`<video src="${m.url}" muted style="width:100%;height:100px;object-fit:cover"></video>`
          :`<img src="${m.url}" style="width:100%;height:100px;object-fit:cover" onerror="this.style.opacity=0.3">`}
        <span class="media-type">${m.type==='video'?'Video':'Image'}</span>
        <button type="button" class="remove-btn" onclick="window.__mmRemove('${containerId}','${hiddenId}',${i})"><i class="fa-solid fa-xmark"></i></button>
      </div>
    `).join('');
  }
  window['__mmAdd_'+containerId]=function(fileOrData){
    if(fileOrData instanceof File){
      if(fileOrData.type.startsWith('video/')&&fileOrData.size>20*1024*1024){toast('Video exceeds 20MB. Please use a URL.','error');return;}
      const r=new FileReader();r.onload=ev=>{items.push({type:fileOrData.type.startsWith('video/')?'video':'image',url:ev.target.result,name:fileOrData.name});render();};r.readAsDataURL(fileOrData);
    }else{items.push(fileOrData);render();}
  };
  window.__mmRemove=function(cid,hid,i){items.splice(i,1);render();};
  render();
}

      <div style="margin-top:16px"><label class="form-label">Live Preview</label><div class="hero-live-preview"><div class="slide" id="hero-lp-slide" style="${s.type==='image'?`background-image:url('${s.url}')`:''};display:flex;align-items:center;justify-content:center;"><div class="overlay"></div>${s.type==='video'?`<video src="${s.url}" muted autoplay loop style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover"></video>`:''}${!s.url?'<i class="fa-solid fa-image" style="font-size:36px;color:rgba(255,255,255,0.2);position:relative;z-index:1"></i>':''}<div class="slide-text"><h4 id="hero-lp-alt">${escapeHtml(s.alt||'Slide preview')}</h4><p id="hero-lp-cap">${escapeHtml(s.caption||'')}</p></div></div></div></div>
    </div>
    <div class="modal-footer"><button class="btn btn-outline" onclick="closeModal()">Cancel</button><button class="btn btn-primary" style="width:auto" onclick="saveHeroSlide()"><i class="fa-solid fa-save"></i>${idx>=0?'Save Slide':'Add Slide'}</button></div>
  `,true);
  // live preview updates
  setTimeout(()=>{
    const altEl=document.getElementById('hero-alt');const capEl=document.getElementById('hero-cap');
    const lpAlt=document.getElementById('hero-lp-alt');const lpCap=document.getElementById('hero-lp-cap');
    altEl.addEventListener('input',()=>lpAlt.textContent=altEl.value||'Slide preview');
    capEl.addEventListener('input',()=>lpCap.textContent=capEl.value);
    // poll for data updates
    setInterval(()=>{const m=getMediaData('hero-media');if(!m)return;const slide=document.getElementById('hero-lp-slide');if(m.type==='image'){slide.style.backgroundImage=`url('${m.url}')`;slide.innerHTML=`<div class="overlay"></div><div class="slide-text"><h4>${escapeHtml(altEl.value||'Slide preview')}</h4><p>${escapeHtml(capEl.value||'')}</p></div>`;}else{slide.style.backgroundImage='none';slide.innerHTML=`<div class="overlay"></div><video src="${m.url}" muted autoplay loop style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover"></video><div class="slide-text"><h4>${escapeHtml(altEl.value||'Slide preview')}</h4><p>${escapeHtml(capEl.value||'')}</p></div>`;}},400);
  },100);
}
function saveHeroSlide(){
  const media=getMediaData('hero-media');
  if(!media){toast('Please upload an image or video.','error');return;}
  const alt=document.getElementById('hero-alt').value.trim();
  const cap=document.getElementById('hero-cap').value.trim();
  const slide={...media,alt,caption:cap};
  if(heroSlideEditIdx>=0)DATA.hero.slides[heroSlideEditIdx]=slide;
  else DATA.hero.slides.push(slide);
  saveData(DATA);closeModal();toast(heroSlideEditIdx>=0?'Slide updated.':'Slide added.');renderHero();
}

      <div><label class="form-label">${id?'New Password (blank = unchanged)':'Password <span class="req">*</span>'}</label><input type="password" class="form-input" id="u-pass" placeholder="${id?'Leave blank to keep':'Set password'}"></div>

}
function saveUser(id){
  const name=document.getElementById('u-name').value.trim();
  const uname=document.getElementById('u-uname').value.trim().toLowerCase().replace(/\s+/g,'_');
  const email=document.getElementById('u-email').value.trim();
  const pass=document.getElementById('u-pass').value;
  const role=document.getElementById('u-role').value;
  const status=document.getElementById('u-status').value;
  if(!name||!uname){toast('Name and username are required.','error');return;}
  if(!id&&!pass){toast('Set a password.','error');return;}
  let ps={};if(role==='admin')ps=allPerms();else document.querySelectorAll('.perm-cb').forEach(cb=>{if(cb.checked)ps[cb.dataset.perm]=1;});
  if(id){const u=DATA.users.find(x=>x.id===id);Object.assign(u,{name,username:uname,email,role,perms:ps,status});if(pass)u.passwordHash=simpleHash(pass);}
  else{if(DATA.users.some(x=>x.username===uname||(email&&x.email===email))){toast('Username or email already exists.','error');return;}DATA.users.push({id:uid(),name,username:uname,email,passwordHash:simpleHash(pass),role,perms:ps,status,createdAt:new Date().toISOString().split('T')[0]});}
  saveData(DATA);closeModal();toast(id?'User updated.':'User created.');renderUsers();
}
function deleteUser(id){if(!confirm('Delete this user?'))return;if(id===CURRENT_USER.id){toast('Cannot delete yourself.','error');return;}DATA.users=DATA.users.filter(x=>x.id!==id);saveData(DATA);toast('User deleted.');renderUsers();}

      <div class="card-body"><p style="font-size:13px;color:var(--gray-600);margin-bottom:16px">Download a CSV report for accounting or board meetings.</p>
        <div style="display:flex;gap:10px;flex-wrap:wrap">
          <button class="btn btn-outline" onclick="exportCSV('donations')"><i class="fa-solid fa-file-csv"></i>Donations CSV</button>
          <button class="btn btn-outline" onclick="exportCSV('members')"><i class="fa-solid fa-file-csv"></i>Members CSV</button>
          <button class="btn btn-outline" onclick="exportCSV('events')"><i class="fa-solid fa-file-csv"></i>Events CSV</button>
          <button class="btn btn-outline" onclick="exportJSON()"><i class="fa-solid fa-file-export"></i>Full Data Export (JSON)</button>
        </div>
      </div>
    </div>`;
  setTimeout(()=>{
    new Chart(document.getElementById('rpt1'),{type:'doughnut',data:{labels:Object.keys(byCampaign),datasets:[{data:Object.values(byCampaign),backgroundColor:['#1a37b8','#f5c842','#10b981','#ef4444','#8b5cf6','#ef6c00'],borderWidth:0}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{padding:14,font:{size:11},usePointStyle:true}}}}});
    new Chart(document.getElementById('rpt2'),{type:'bar',data:{labels:Object.keys(byMethod),datasets:[{label:'Amount',data:Object.values(byMethod),backgroundColor:'rgba(26,55,184,0.75)',borderRadius:6,maxBarThickness:50}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,grid:{color:'#f1f5f9'}},x:{grid:{display:false}}}}});
  },50);
}
function csvEscape(v){return '"'+String(v==null?'':v).replace(/"/g,'""')+'"';}
function download(filename,content,type='text/csv'){const blob=new Blob([content],{type});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;a.click();URL.revokeObjectURL(url);}
function exportCSV(type){let rows=[];let fn='zglf-'+type+'.csv';
  if(type==='donations'){rows=[['Donor','Email','Amount','Campaign','Method','Date','Status','Anonymous','Note']];DATA.donations.forEach(d=>rows.push([d.donor,d.email,d.amount,d.campaign,d.method,d.date,d.status,d.anonymous?'Yes':'No',d.note||'']));}
  else if(type==='members'){rows=[['Name','Email','Phone','State','Tier','Joined','Status']];DATA.members.forEach(m=>rows.push([m.name,m.email,m.phone,m.state,m.tier,m.joined,m.status]));}
  else if(type==='events'){rows=[['Title','Date','Time','Location','Status','Media Count']];DATA.events.forEach(e=>rows.push([e.title,e.date,e.time,e.location,e.status,(e.media||[]).length]));}
  download(fn,rows.map(r=>r.map(csvEscape).join(',')).join('\n'));toast('Export downloaded.');
}
function exportJSON(){download('zglf-full-export-'+new Date().toISOString().split('T')[0]+'.json',JSON.stringify(DATA,null,2),'application/json');toast('Full export downloaded.');}

    </div>`;
}
function saveSettings(){DATA.settings.currency=document.getElementById('set-cur').value;DATA.settings.currencySymbol={NGN:'₦',USD:'$',EUR:'€',GBP:'£'}[DATA.settings.currency];DATA.settings.defaultContactEmail=document.getElementById('set-email').value;DATA.settings.maintenanceMode=document.getElementById('set-maint').checked;saveData(DATA);toast('Settings saved.');}
function exportBackup(){download('zglf-backup-'+new Date().toISOString().split('T')[0]+'.json',JSON.stringify(DATA,null,2),'application/json');toast('Backup downloaded.');}
function importBackup(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>{try{const d=JSON.parse(ev.target.result);saveData(d);DATA=d;toast('Backup restored.');render();}catch(err){toast('Invalid backup file.','error');}};r.readAsText(f);}
function resetData(){if(!confirm('Erase ALL data and reset to defaults?'))return;if(!prompt('Type ERASE to confirm.','')==='ERASE'){toast('Cancelled.','error');return;}if(!confirm('This is irreversible. Continue?'))return;localStorage.removeItem(LS_KEY);DATA=loadData();toast('Data reset to defaults.');render();}
function noPerm(){document.getElementById('pageContent').innerHTML='<div class="card"><div class="card-body" style="text-align:center;padding:60px 20px;color:var(--gray-400)"><i class="fa-solid fa-lock" style="font-size:48px;margin-bottom:16px;opacity:0.3;display:block"></i><p style="font-size:14px">You do not have permission to access this section.<br>Contact an administrator.</p></div></div>';}

/* ============================ INIT ============================ */
render();
</script>
