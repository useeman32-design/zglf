<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZGLF Admin</title>
<link rel="icon" type="image/jpeg" href="../images/zglf-logo.jpg">
<link rel="stylesheet" href="admin.css?v=FIXED-v6-client">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>

<div id="loginView" class="login-wrap" style="display:none">
  <div class="login-card">
    <div class="login-logo">
      <img src="../images/zglf-logo.jpg" alt="ZGLF">
      <div class="login-logo-text"><h1>Zee Glow Link</h1><p>Admin Portal</p></div>
    </div>
    <div class="login-title"><h2>Welcome back</h2><p>Sign in to manage the ZGLF website</p></div>
    <div id="loginError" class="error-msg" style="display:none"><i class="fa-solid fa-circle-exclamation"></i><span></span></div>
    <form id="loginForm">
      <div class="form-group"><label>Username or Email</label><input type="text" id="loginEmail" class="form-input" placeholder="admin" required></div>
      <div class="form-group"><label>Password</label><input type="password" id="loginPass" class="form-input" placeholder="••••••••" required></div>
      <button type="submit" class="btn btn-primary"><i class="fa-solid fa-right-to-bracket"></i>Sign In</button>
    </form>
    <div class="login-hint">Default: <strong>admin</strong> / <strong>admin123</strong></div>
  </div>
</div>

<div id="appView" style="display:none">
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header"><a href="#/dashboard" class="sidebar-brand"><img src="../images/zglf-logo.jpg" alt="ZGLF"><div class="sidebar-brand-text"><h3>ZGLF Admin</h3><p>Content Console</p></div></a></div>
      <nav class="sidebar-nav" id="sidebarNav"></nav>
      <div class="sidebar-footer"><div class="sidebar-user">
        <div class="sidebar-user-avatar" id="userAvatar">A</div>
        <div class="sidebar-user-info"><div class="sidebar-user-name" id="userName">Admin</div><div class="sidebar-user-role" id="userRole">Administrator</div></div>
        <button class="sidebar-logout" onclick="logout()" title="Sign out"><i class="fa-solid fa-right-from-bracket"></i></button>
      </div></div>
    </aside>
    <div class="mobile-overlay" id="mobileOverlay" onclick="toggleSidebar()"></div>
    <main class="main">
      <header class="topbar">
        <div class="topbar-left">
          <button class="hamburger" onclick="toggleSidebar()"><i class="fa-solid fa-bars"></i></button>
          <div class="page-title"><h1 id="pageTitle">Dashboard</h1><p id="pageSubtitle"></p></div>
        </div>
        <div class="topbar-right">
          <a href="../index.html" target="_blank" class="view-site"><i class="fa-solid fa-arrow-up-right-from-square"></i>View Site</a>
          <button class="topbar-icon" onclick="navigate('messages')" title="Messages"><i class="fa-regular fa-bell"></i><span class="badge" id="msgBadge">0</span></button>
        </div>
      </header>
      <div class="content" id="pageContent"></div>
    </main>
  </div>
</div>

<div class="modal-overlay" id="modal"><div class="modal" id="modalInner"></div></div>
<div class="toast" id="toast"></div>

<script src="admin.js?v=FIXED-v6-client"></script>
<script>
// Cache-bust: if a stale admin.js is cached from an old version, force reload once
(function(){
  const BUILD='FIXED-v6-client';
  if(localStorage.getItem('zglf_build')!==BUILD){
    localStorage.setItem('zglf_build',BUILD);
    localStorage.removeItem('zglf_token');
    localStorage.removeItem('zglf_user');
    // Swap the script tag to load fresh build
    setTimeout(()=>location.reload(true),50);
  }
})();
</script>
</body>
</html>
